<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iconAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#iconBg)"/>
  
  <!-- Architectural Icon -->
  <g transform="translate(5, 5)">
    <!-- Base structural foundation -->
    <rect x="15" y="72" width="60" height="4" rx="2" fill="#d97706" />
    
    <!-- Outer Arch -->
    <path d="M 20,72 L 45,18 L 70,72" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Arch -->
    <path d="M 32,72 L 45,36 L 58,72" fill="none" stroke="url(#iconAccent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Crossbeam -->
    <line x1="26" y1="54" x2="64" y2="54" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Apex Diamond -->
    <rect x="42" y="10" width="6" height="6" fill="#d97706" transform="rotate(45 45 13)" />
  </g>
</svg>
